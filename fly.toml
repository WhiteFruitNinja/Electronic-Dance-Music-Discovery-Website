app = "electronic-dance-music-discovery-website"
kill_signal = "SIGINT"
kill_timeout = 5
primary_region = "arn"

[experimental]
auto_rollback = true
private_network = false  # Does not allow Coder to connect to the database

[[services]]
protocol = "tcp"
internal_port = 3000
processes = ["app"]

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]
[services.concurrency]
type = "connections"